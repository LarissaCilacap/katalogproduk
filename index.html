<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalog Produk</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Library JS Page-Flip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: sans-serif;
      touch-action: manipulation;
    }
    /* KONTANER UTAMA DENGAN POSISI CENTER PRESISI */
    .viewport-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    #flipbook-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    .page-sheet {
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.3s ease-in-out;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between select-none">

  <!-- AREA UTAMA DISPLAY KATALOG -->
  <div class="viewport-container">
    <div id="flipbook-wrapper">
      <div id="flipbook"></div>
    </div>
  </div>

  <!-- FLOATING NAVBAR BOTTOM (NAVIGASI EKSKLUSIF BUKU) -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md px-6 py-3 rounded-full flex items-center gap-5 text-white text-lg z-50 shadow-2xl border border-white/10">
    <button onclick="flipPrev()" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-chevron-left"></i>
    </button>
    <span class="text-xs font-semibold tracking-wider select-none px-2" id="page-num">1 / 81</span>
    <button onclick="flipNext()" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <script>
    let pageFlip;

    const TOTAL_PAGES = 81;
    const PRELOAD_BUFFER = 4; // Mengunduh 4 halaman ke depan secara bertahap
    const BLANK_PLACEHOLDER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 540 766'%3E%3C/svg%3E";

    // FUNGSI OPTIMASI LAZY LOADING GAMBAR
    function loadAheadImages(currentPageIndex) {
      const startIdx = currentPageIndex;
      const endIdx = Math.min(currentPageIndex + PRELOAD_BUFFER, TOTAL_PAGES - 1);

      for (let i = startIdx; i <= endIdx; i++) {
        const img = document.getElementById(`img-page-${i + 1}`);
        if (img && img.getAttribute('data-src')) {
          img.src = img.getAttribute('data-src');
          img.removeAttribute('data-src'); // Tandai bahwa gambar telah dimuat
        }
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const flipbookContainer = document.getElementById('flipbook');

      // 1. GENERATE DINAMIS ELEMEN 81 HALAMAN
      for (let i = 1; i <= TOTAL_PAGES; i++) {
        const pageSheet = document.createElement('div');
        pageSheet.className = 'page-sheet';

        const img = document.createElement('img');
        img.id = `img-page-${i}`;
        img.setAttribute('data-src', `produk/Produk-${i}.jpg`);
        img.src = BLANK_PLACEHOLDER;
        img.alt = `Halaman Katalog ${i}`;

        pageSheet.appendChild(img);
        flipbookContainer.appendChild(pageSheet);
      }

      // Preload 4 halaman pertama saat aplikasi dibuka
      loadAheadImages(0);

      // 2. INISIALISASI ST.PAGEFLIP (MATIKAN SWIPE & KLIK HALAMAN MANUAL)
      pageFlip = new St.PageFlip(flipbookContainer, {
        width: 540,
        height: 766,
        size: "stretch",
        minWidth: 280,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1500,
        drawShadow: true,
        showCover: true,
        mobileScrollSupport: false,
        clickToFlip: false,     // Matikan interaksi klik kertas
        swipeDistance: 99999    // Kunci penuh gestur swipe jari pada layar
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page-sheet'));

      // EVENT LISTENER EVENT BALIK HALAMAN
      pageFlip.on('flip', (e) => {
        const total = pageFlip.getPageCount();
        const currentIdx = e.data;
        document.getElementById('page-num').innerText = `${currentIdx + 1} / ${total}`;
        
        // Panggil pengunduhan halaman selanjutnya
        loadAheadImages(currentIdx);
      });
    });

    // FUNGSI NAVIGASI PEMBALIK HALAMAN VIA TOMBOL GUI
    function flipPrev() {
      if (pageFlip) pageFlip.flipPrev();
    }

    function flipNext() {
      if (pageFlip) pageFlip.flipNext();
    }
  </script>
</body>
</html>
