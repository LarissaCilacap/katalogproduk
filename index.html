<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalog Produk Online</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Library JS Page-Flip Gratis & Bebas Iklan -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a; /* Latar belakang gelap elegan */
      font-family: sans-serif;
    }
    .flipbook-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .page-sheet {
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between">

  <!-- AREA KONTANER FLIPBOOK -->
  <div class="flipbook-container" id="book-wrapper">
    <div id="flipbook">
      
      <!-- HALAMAN DIPANGGIL DARI FOLDER "produk" -->
      <div class="page-sheet">
        <img src="produk/Produk-1.jpg" alt="Sampul Depan Menu">
      </div>
      <div class="page-sheet">
        <img src="produk/Produk-2.jpg" alt="Halaman 1">
      </div>
      <div class="page-sheet">
        <img src="produk/Produk-3.jpg" alt="Halaman 2">
      </div>
      <div class="page-sheet">
        <img src="produk/Produk-4.jpg" alt="Sampul Belakang">
      </div>

    </div>
  </div>

  <!-- FLOATING NAVBAR NAVIGASI -->
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-md px-6 py-2.5 rounded-full flex items-center gap-6 text-white text-xl z-50 shadow-2xl border border-white/10">
    <button onclick="pageFlip.flipPrev()" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-chevron-left"></i>
    </button>
    
    <span class="text-sm font-semibold tracking-wider select-none" id="page-num">1 / 4</span>

    <button onclick="pageFlip.flipNext()" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <script>
    let pageFlip;

    document.addEventListener('DOMContentLoaded', function() {
      const targetElement = document.getElementById('flipbook');

      // Inisialisasi Pengaturan Buku
      pageFlip = new St.PageFlip(targetElement, {
        width: 540,          // Lebar proporsional dasar (px)
        height: 766,         // Tinggi proporsional dasar (px)
        size: "stretch",     // Otomatis menyesuaikan ukuran layar HP (responsive)
        minWidth: 280,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1400,
        drawShadow: true,    // Efek bayangan lipatan 3D
        showCover: true,     // Tampilkan sampul depan secara tunggal
        mobileScrollSupport: false
      });

      // Render elemen gambar menjadi halaman buku
      pageFlip.loadFromHTML(document.querySelectorAll('.page-sheet'));

      // Pembaruan angka halaman aktif saat dibalik
      pageFlip.on('flip', (e) => {
        const total = pageFlip.getPageCount();
        const current = e.data + 1;
        document.getElementById('page-num').innerText = `${current} / ${total}`;
      });
    });
  </script>
</body>
</html>
