<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalog Produk</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Library JS Page-Flip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <!-- Library JS Panzoom -->
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: sans-serif;
      touch-action: none; /* Mencegah gesture multitouch bawaan browser HP */
    }

    /* KONTANER UTAMA DIKUNCI PRESISI DI TENGAH LAYAR */
    .viewport-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    #panzoom-target {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .page-sheet {
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between">

  <!-- AREA KONTANER DENGAN STRUKTUR CENTER PRESISI -->
  <div class="viewport-container">
    <div id="panzoom-target">
      <div id="flipbook">
        <div class="page-sheet">
          <img src="produk/Produk-1.jpg" alt="Sampul Depan Menu">
        </div>
        <div class="page-sheet">
          <img src="produk/Produk-2.jpg" alt="Halaman 1">
        </div>
        <div class="page-sheet">
          <img src="produk/Produk-3.jpg" alt="Halaman 2">
        </div>
        <div class="page-sheet">
          <img src="produk/Produk-4.jpg" alt="Sampul Belakang">
        </div>
      </div>
    </div>
  </div>

  <!-- FLOATING NAVBAR TOP (TOMBOL ZOOM CONTROL) -->
  <div class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900/85 backdrop-blur-md px-5 py-2.5 rounded-full flex items-center gap-4 text-white text-lg z-50 shadow-2xl border border-white/10">
    <!-- Tombol Zoom In, Zoom Out, dan Reset -->
    <button id="btn-zoom-in" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-search-plus"></i>
    </button>
    <button id="btn-zoom-out" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-search-minus"></i>
    </button>
    <button id="btn-zoom-reset" class="hover:text-[#009D7B] active:scale-90 transition p-1 text-xs bg-white/10 px-2 py-1 rounded">
      Reset
    </button>
  </div>

  <!-- FLOATING NAVBAR BOTTOM (NAVIGASI HALAMAN) -->
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/85 backdrop-blur-md px-5 py-2.5 rounded-full flex items-center gap-4 text-white text-lg z-50 shadow-2xl border border-white/10">
    <!-- Navigasi Halaman -->
    <button onclick="safeFlipPrev()" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-chevron-left"></i>
    </button>
    <span class="text-xs font-semibold tracking-wider select-none px-1" id="page-num">1 / 4</span>
    <button onclick="safeFlipNext()" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <script>
    let pageFlip;
    let panzoom;

    document.addEventListener('DOMContentLoaded', function() {
      const targetElement = document.getElementById('flipbook');
      const panzoomTarget = document.getElementById('panzoom-target');

      // 1. Inisialisasi Pengaturan Flipbook (SWIPE DAN KLIK MANUAL DIMATIKAN TOTAL)
      pageFlip = new St.PageFlip(targetElement, {
        width: 540,
        height: 766,
        size: "stretch",
        minWidth: 280,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1500,
        drawShadow: true,
        showCover: true,
        mobileScrollSupport: false,
        clickToFlip: false,       // Matikan klik/tap langsung pada kertas untuk balik halaman
        swipeDistance: 0,         // Matikan gestur swipe jari untuk balik halaman
        useTouchEvents: false     // Matikan pemrosesan touch event internal dari PageFlip
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page-sheet'));

      pageFlip.on('flip', (e) => {
        const total = pageFlip.getPageCount();
        const current = e.data + 1;
        document.getElementById('page-num').innerText = `${current} / ${total}`;
        
        // Reset posisi zoom setiap kali pindah halaman
        if (panzoom) panzoom.reset();
      });

      // 2. Inisialisasi Panzoom (Hanya untuk Drag/Pan & Zoom via Tombol)
      panzoom = Panzoom(panzoomTarget, {
        maxScale: 2,         // Maksimal zoom-in 2x lipat
        minScale: 1,         // Skala normal
        contain: 'outside',  // Mencegah gambar bergeser terlalu jauh keluar layar
        cursor: 'default'
      });

      // POIN 1: MEMATIKAN PINCH-ZOOM 2 JARI SECARA MUTLAK
      const preventPinchZoom = function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
          e.stopPropagation();
        }
      };

      window.addEventListener('touchstart', preventPinchZoom, { passive: false, capture: true });
      window.addEventListener('touchmove', preventPinchZoom, { passive: false, capture: true });

      // Hubungkan tombol navigasi zoom GUI
      document.getElementById('btn-zoom-in').addEventListener('click', () => panzoom.zoomIn());
      document.getElementById('btn-zoom-out').addEventListener('click', () => panzoom.zoomOut());
      document.getElementById('btn-zoom-reset').addEventListener('click', () => panzoom.reset());
    });

    // POIN 2: PEMBALIK HALAMAN EKSKLUSIF HANYA MELALUI TOMBOL GUI
    function safeFlipPrev() {
      if (panzoom) panzoom.reset();
      setTimeout(() => pageFlip.flipPrev(), 50);
    }

    function safeFlipNext() {
      if (panzoom) panzoom.reset();
      setTimeout(() => pageFlip.flipNext(), 50);
    }
  </script>
</body>
</html>
