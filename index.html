<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katalog Produk</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Library JS Page-Flip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <!-- Library JS Panzoom -->
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: sans-serif;
      touch-action: none;
    }
    .viewport-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    #panzoom-target {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    .page-sheet {
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    .page-sheet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      /* Efek transisi halus saat gambar selesai terunduh */
      transition: opacity 0.3s ease-in-out;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between">

  <!-- AREA KONTANER DENGAN STRUKTUR CENTER PRESISI -->
  <div class="viewport-container">
    <div id="panzoom-target">
      <div id="flipbook"></div>
    </div>
  </div>

  <!-- FLOATING NAVBAR TOP (TOMBOL ZOOM CONTROL) -->
  <div class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900/85 backdrop-blur-md px-5 py-2.5 rounded-full flex items-center gap-4 text-white text-lg z-50 shadow-2xl border border-white/10">
    <button id="btn-zoom-in" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-search-plus"></i>
    </button>
    <button id="btn-zoom-out" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-search-minus"></i>
    </button>
    <button id="btn-zoom-reset" class="hover:text-[#009D7B] active:scale-90 transition p-1 text-xs bg-white/10 px-2 py-1 rounded-full">
      Reset
    </button>
  </div>

  <!-- FLOATING NAVBAR BOTTOM (NAVIGASI HALAMAN) -->
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/85 backdrop-blur-md px-5 py-2.5 rounded-full flex items-center gap-4 text-white text-lg z-50 shadow-2xl border border-white/10">
    <button onclick="safeFlipPrev()" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-chevron-left"></i>
    </button>
    <span class="text-xs font-semibold tracking-wider select-none px-1" id="page-num">1 / 81</span>
    <button onclick="safeFlipNext()" class="hover:text-[#009D7B] active:scale-90 transition p-1">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <script>
    let pageFlip;
    let panzoom;

    const TOTAL_PAGES = 81;
    const PRELOAD_BUFFER = 4; // Mengunduh 4 halaman ke depan dari posisi aktif
    
    // Pixel transparan ringan untuk placeholder awal
    const BLANK_PLACEHOLDER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 540 766'%3E%3C/svg%3E";

    // FUNGSI LAZY LOADING: HANYA UNDUH GAMBAR SESUAI URUTAN
    function loadAheadImages(currentPageIndex) {
      // Index dimulai dari 0 (halaman 1 = index 0)
      const startIdx = currentPageIndex;
      const endIdx = Math.min(currentPageIndex + PRELOAD_BUFFER, TOTAL_PAGES - 1);

      for (let i = startIdx; i <= endIdx; i++) {
        const img = document.getElementById(`img-page-${i + 1}`);
        if (img && img.getAttribute('data-src')) {
          const realSrc = img.getAttribute('data-src');
          img.src = realSrc; 
          img.removeAttribute('data-src'); // Tandai bahwa gambar sudah diunduh
        }
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const flipbookContainer = document.getElementById('flipbook');
      const panzoomTarget = document.getElementById('panzoom-target');

      // 1. GENERATE ELEMEN DENGAN LAZY LOADING ATTRIBUTE
      for (let i = 1; i <= TOTAL_PAGES; i++) {
        const pageSheet = document.createElement('div');
        pageSheet.className = 'page-sheet';

        const img = document.createElement('img');
        img.id = `img-page-${i}`;
        
        // Simpan URL asli di 'data-src', gunakan placeholder ringan untuk 'src' awal
        img.setAttribute('data-src', `produk/Produk-${i}.jpg`);
        img.src = BLANK_PLACEHOLDER;
        img.alt = `Halaman Katalog ${i}`;

        pageSheet.appendChild(img);
        flipbookContainer.appendChild(pageSheet);
      }

      // Unduh gambar awal (halaman 1 sampai 4) sebelum library diinisialisasi
      loadAheadImages(0);

      // 2. INISIALISASI FLIPBOOK
      pageFlip = new St.PageFlip(flipbookContainer, {
        width: 540,
        height: 766,
        size: "stretch",
        minWidth: 280,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1500,
        drawShadow: true,
        showCover: true,
        mobileScrollSupport: false,
        clickToFlip: false,
        swipeDistance: 0,
        useTouchEvents: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page-sheet'));

      // DETEKSI PERPINDAHAN HALAMAN UNTUK MEMICU PRELOAD GAMBAR SELANJUTNYA
      pageFlip.on('flip', (e) => {
        const total = pageFlip.getPageCount();
        const currentIdx = e.data; // Index halaman saat ini (0..79)
        
        document.getElementById('page-num').innerText = `${currentIdx + 1} / ${total}`;
        
        // Unduh 4 gambar berikutnya di latar belakang
        loadAheadImages(currentIdx);

        if (panzoom) panzoom.reset();
      });

      // 3. INISIALISASI PANZOOM
      panzoom = Panzoom(panzoomTarget, {
        maxScale: 2,
        minScale: 1,
        contain: 'outside',
        cursor: 'default'
      });

      // Mematikan Pinch-Zoom Dua Jari
      const preventPinchZoom = function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
          e.stopPropagation();
        }
      };

      window.addEventListener('touchstart', preventPinchZoom, { passive: false, capture: true });
      window.addEventListener('touchmove', preventPinchZoom, { passive: false, capture: true });

      // Event Listener Tombol Zoom
      document.getElementById('btn-zoom-in').addEventListener('click', () => panzoom.zoomIn());
      document.getElementById('btn-zoom-out').addEventListener('click', () => panzoom.zoomOut());
      document.getElementById('btn-zoom-reset').addEventListener('click', () => panzoom.reset());
    });

    // Navigasi Halaman via Tombol GUI
    function safeFlipPrev() {
      if (panzoom) panzoom.reset();
      setTimeout(() => pageFlip.flipPrev(), 50);
    }

    function safeFlipNext() {
      if (panzoom) panzoom.reset();
      setTimeout(() => pageFlip.flipNext(), 50);
    }
  </script>
</body>
</html>
